# Orva behaviour.  Hardware pins live in printer.cfg.

[orva_motion]
# Lines passing closer than this to center are routed exactly through it
center_snap: 0.3
# Moves within this radius of center are split into short pieces so only the
# pieces near their closest point slow down
split_radius: 30
split_length: 2
# The first layer must stay on the PEI; only overhangs may reach past it
first_layer_radius: 98
first_layer_max_z: 0.6
# Fixed Z-min plunger on the rim: overhangs passing over its radius must be
# at least this high
zstop_radius: 106.7
zstop_band: 3
zstop_clear_z: 3.5
# Bed-only turn at center (when a line continues past the arm's reach)
pivot_speed: 180      # deg/s
pivot_accel: 720      # deg/s^2

[orva_level]
edge_radius: 86
center_radius: 18
probe_height: 3
travel_speed: 80
max_range: 1.5

[orva_flowtest]
offset: 3.5
max_radius: 96.8
speeds: 35, 75, 125
line_width: 0.45
layer_height: 0.2
default_flow_ratio: 1.0
default_pressure_advance: 0.035
measure: none

[exclude_object]

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: False

[respond]
