# Orva macros: startup, print start/end, tower and power handling.

# Power-on: the touch bar plays the O animation by itself; the brush rises
# (orva_wiper does that on klippy:ready).  Then home and level, if the tower
# is on.
[delayed_gcode orva_power_on]
initial_duration: 3
gcode:
    ORVA_STARTUP

[gcode_macro ORVA_STARTUP]
description: Home and level after power-on
gcode:
    {% if printer.orva_tower.attached %}
        G28 X
        ORVA_LEVEL
        G1 Z10 F600
    {% else %}
        RESPOND MSG="Orva: attach the tower to finish startup"
    {% endif %}

# Slicer start G-code:  PRINT_START BED=[bed_temperature_initial_layer]
#                                   EXTRUDER=[nozzle_temperature_initial_layer]
# EXCLUDE_OBJECT_DEFINE lines must come before it (label objects in the
# slicer) so the flow test and wiper know where the parts are.
[gcode_macro PRINT_START]
description: Orva print start: level if needed, heat, flow test, wipe
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(210)|float %}
    {% if not printer.orva_tower.attached %}
        { action_raise_error("Orva: the tower isn't attached") }
    {% endif %}
    M140 S{BED}
    M104 S150
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Levels only at power-on, after the tower was reattached, or after
    # ORVA_RELEVEL; otherwise keeps the remembered surface.
    ORVA_ENSURE_LEVEL
    G1 Z5 F600
    M190 S{BED}
    M109 S{EXTRUDER}
    # Brush stays up, unless a part overhangs past the bed
    ORVA_WIPER_MODE MODE=AUTO
    ORVA_FLOW_TEST
    ORVA_WIPE
    G92 E0

[gcode_macro PRINT_END]
description: Orva print end
gcode:
    M400
    G91
    G1 E-2 F2400
    G1 Z10 F600
    G90
    M104 S0
    M140 S0
    M106 S0
    M221 S100
    ORVA_WIPER_MODE MODE=NORMAL

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M106 S0
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F600
    G90

[gcode_macro ORVA_RELEVEL]
description: Re-home Z and re-level now (adds to the remembered map)
gcode:
    ORVA_LEVEL
    G1 Z10 F600

[gcode_macro ORVA_ON_TOWER_ATTACH]
description: Runs when the tower is seated again
gcode:
    RESPOND MSG="Orva: tower attached, re-homing and re-leveling"
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        ORVA_RELEVEL
    {% endif %}

[gcode_macro ORVA_ON_TOWER_DETACH]
description: Runs when the tower is lifted off
gcode:
    {% if printer.print_stats.state == "printing" %}
        PAUSE
    {% endif %}
    RESPOND MSG="Orva: tower detached"

# Pack-up / power-off: reverse startup on the touch bar, clear the arm,
# brush down, motors off, then shut the host down cleanly.
[gcode_macro ORVA_SHUTDOWN]
description: Park, lower the brush and power off
gcode:
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("Orva: stop the print before shutting down") }
    {% endif %}
    TURN_OFF_HEATERS
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z{ [printer.toolhead.position.z + 5, 20]|max } F600
    {% endif %}
    ORVA_WIPER STATE=DOWN
    ORVA_TOUCHBAR STATE=OFF
    M84
    G4 P3000
    {action_call_remote_method("shutdown_machine")}
