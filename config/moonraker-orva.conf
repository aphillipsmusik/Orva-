# Orva additions to moonraker.conf  ([include moonraker-orva.conf])

# Lets slicers and apps find the printer on the network as "Orva"
[zeroconf]

# Keep the Orva firmware up to date from the Mainsail/Fluidd update panel
[update_manager orva]
type: git_repo
path: @ORVA_DIR@
origin: https://github.com/aphillipsmusik/orva-.git
primary_branch: main
managed_services: klipper
is_system_service: False
