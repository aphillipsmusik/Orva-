# Orva printer configuration: BTT Manta M4P + CB1, EBB36 toolboard
#
# Board slot mapping (Manta M4P has 4 plug-in driver slots):
#   X slot  -> stepper_bed  (theta: bed ring)
#   Y slot  -> stepper_arm  (r: rack and pinion under the bed)
#   Z slot  -> stepper_z    (belt loop in the tower foot, via the joint)
#   E slot  -> spare (the extruder lives on the EBB36 toolboard)
#
# Pins come from Klipper's generic-bigtreetech-manta-m4p.cfg and
# sample-bigtreetech-ebb-canbus-v1.2.cfg.  CHECK THEM against your exact
# board revisions (EBB36 Gen2 in particular) before powering motors.
# Values marked "measure" depend on your build.

[include orva.cfg]
[include orva_macros.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_REPLACE-if00

# EBB36 on the toolhead.  The M4P has no CAN port, so run the EBB36 in USB
# mode (Gen2) or add a USB-to-CAN adapter and use canbus_uuid instead.
[mcu ebb]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_EBB_REPLACE-if00
#canbus_uuid: REPLACE

[printer]
kinematics: orva_polar
max_velocity: 200
max_accel: 3000
max_z_velocity: 15
max_z_accel: 200
# Bed turn-rate limits used to slow lines that pass close to center
max_angular_velocity: 6     # rad/s
max_angular_accel: 60       # rad/s^2
# Radius of the Z-min plunger on the rim (the arm goes out here to home Z)
z_home_radius: 106

[stepper_bed]
step_pin: PC6
dir_pin: PA14
enable_pin: !PC7
microsteps: 16
# Bed ring : pinion.  Default assumes a GT2 belt bonded teeth-out around a
# ~200 mm hub (about 314 teeth) driven by a 20T pulley.  For a cut ring
# gear use its tooth count, e.g. 190:16.
gear_ratio: 314:20

[stepper_arm]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
# Module 1 rack, 20 tooth pinion: pi * 1 * 20 = 62.83 mm per turn
rotation_distance: 62.832
endstop_pin: ^PC0
# Arm range: 25 mm behind center (reach past center) out to just inside
# the base edge, over the rim (overhangs).
position_min: -25
position_max: 110.5
position_endstop: 110.5    # measure: r at which the base endstop trips
homing_speed: 30

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
# GT2 belt on a 40 tooth pulley
rotation_distance: 80
# Z-min: sealed microswitch fixed in the rim beside the wiper, pressed by
# the tab on the hotend shroud.  Trips with the nozzle 0.5 mm above the bed.
endstop_pin: ^PC1
position_endstop: 0.5
position_max: 180          # measure
homing_speed: 8
second_homing_speed: 2

[tmc2209 stepper_bed]
uart_pin: PB12
run_current: 0.6
stealthchop_threshold: 0

[tmc2209 stepper_arm]
uart_pin: PC10
run_current: 0.5
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC9
run_current: 0.5
stealthchop_threshold: 0

[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
rotation_distance: 4.637   # Orbiter-class geared extruder; calibrate
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G   # Revo/Rapido-class; match yours
sensor_pin: ebb:PA3
control: pid
pid_Kp: 21.5
pid_Ki: 1.06
pid_Kd: 109.0
min_temp: 0
max_temp: 285
pressure_advance: 0.035
max_extrude_cross_section: 2.0

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.45
stealthchop_threshold: 999999

[fan]
# radial blower on the Z collar, ducted under the arm to the nozzle
pin: ebb:PA0

[heater_fan hotend_fan]
pin: ebb:PA1
heater: extruder
heater_temp: 50.0

[heater_bed]
# The M4P bed output drives a 48 V DC SSR / MOSFET module; the round
# silicone heater runs from the 48 V USB-C PD rail through the slip ring.
heater_pin: PD8
sensor_type: Generic 3950
sensor_pin: PC4
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948.0
min_temp: 0
max_temp: 110

# Z-max stop at the top of the tower: should never trip in normal use.
[gcode_button orva_zmax]
pin: ^PC2
press_gcode:
    M112

# Wiper brush lift (micro servo + cam).  Use a PWM-capable pin; the probe /
# servo header on the M4P works.  Check your board's pinout.
[servo orva_wiper]
pin: PA1
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

[orva_wiper]
servo: orva_wiper
up_angle: 90
down_angle: 0

# Tower sense contact in the dovetail joint (pad on the tower shorts it to
# ground when the tower is seated).
[orva_tower]
sense_pin: ^!PC15

# Touch bar on the front of the base (USB serial).
[orva_touchbar]
serial: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_REPLACE-if00

# Probe for leveling.  Any [probe]-compatible sensor works; a nozzle-contact
# sensor is best on a rotating bed (no offset to rotate).  Examples:
#
#   [probe]                     # load cell / nozzle switch on the EBB36
#   pin: ebb:PB6
#   x_offset: 0
#   y_offset: 0
#   z_offset: 0
#   speed: 3
#   samples: 2
#
#   Beacon / Cartographer / BTT Eddy: use the vendor's section instead.
#   Their x_offset is along the arm and y_offset across it (Orva rotates
#   the offset with the bed).
[probe]
pin: ebb:PB6
x_offset: 0
y_offset: 0
z_offset: 0
speed: 3
samples: 2
samples_tolerance: 0.02

[temperature_sensor cb1]
sensor_type: temperature_host
