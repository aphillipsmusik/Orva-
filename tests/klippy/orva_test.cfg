# Batch-mode test config: Orva on a Linux "process" MCU (no hardware needed)
[include ../../config/orva.cfg]
[include ../../config/orva_macros.cfg]

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: orva_polar
max_velocity: 200
max_accel: 3000
max_z_velocity: 15
max_z_accel: 200
max_angular_velocity: 6
max_angular_accel: 60
z_home_radius: 141

[stepper_bed]
step_pin: gpiochip0/gpio1
dir_pin: gpiochip0/gpio2
enable_pin: !gpiochip0/gpio3
microsteps: 16
gear_ratio: 120:16, 60:20

[stepper_arm]
step_pin: gpiochip0/gpio4
dir_pin: gpiochip0/gpio5
enable_pin: !gpiochip0/gpio6
microsteps: 16
rotation_distance: 62.832
endstop_pin: ^gpiochip0/gpio7
position_min: -32
position_max: 146.5
position_endstop: 146.5
homing_speed: 30

[stepper_z]
step_pin: gpiochip0/gpio8
dir_pin: gpiochip0/gpio9
enable_pin: !gpiochip0/gpio10
microsteps: 16
rotation_distance: 80
endstop_pin: ^gpiochip0/gpio11
position_endstop: 0.5
position_max: 260
homing_speed: 8

[extruder]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: !gpiochip0/gpio14
microsteps: 16
rotation_distance: 4.637
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpiochip0/gpio15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: watermark
min_temp: 0
max_temp: 285
min_extrude_temp: 0
max_extrude_cross_section: 2.0

[heater_bed]
heater_pin: gpiochip0/gpio16
sensor_type: Generic 3950
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 110

[servo orva_wiper]
pin: gpiochip0/gpio17
maximum_servo_angle: 180
initial_angle: 0

[orva_wiper]
servo: orva_wiper
radius: 141
radius_min: 138.5
radius_max: 143.5
overhang_radius: 128

[orva_tower]
sense_pin: ^!gpiochip0/gpio18

[orva_touchbar]
serial: /tmp/orva-touchbar-test-nonexistent

[probe]
pin: gpiochip0/gpio19
z_offset: 0
speed: 5
