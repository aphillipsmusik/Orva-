; Orva touch bar firmware: LILYGO T-Display-S3 Long (ESP32-S3, 180x640
; AXS15231 QSPI panel with touch), mounted landscape on the front of the base.
;
; First run ./fetch_libs.sh once (copies LILYGO's display/touch libraries),
; then:  pio run -t upload
[platformio]
boards_dir = boards

[env:orva_touchbar]
platform = espressif32 @6.5.0
board = T-Display-Long
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
